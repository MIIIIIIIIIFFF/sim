[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overnight-edge"
version = "2.8.0"
description = "Rank large-cap stocks by day-to-day compounded overnight return (buy at close, sell pre-open)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "lxml>=4.9.0",
    "tabulate>=0.9.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
overnight-edge = "run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["overnight_edge*"]
